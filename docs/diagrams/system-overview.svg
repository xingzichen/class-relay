  <rect x="75" y="495" width="1020" height="38" rx="8" fill="#f8cecc" stroke="#b85450"/><text x="585" y="519" class="s" text-anchor="middle">原始群消息是不可信输入；正式知识必须绑定老师身份、当前版本与字段级证据，发送必须经过 Outbox 机械保护。</text>
