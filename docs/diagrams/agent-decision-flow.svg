<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="560" viewBox="0 0 1160 560" role="img" aria-labelledby="title desc">
  <title id="title">Agent 决策与执行边界</title><desc id="desc">Agent使用身份和知识工具作出唯一最终动作，Outbox执行机械保护并记录审计。</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#667085"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#17202a}.h{font-size:17px;font-weight:700}.n{font-size:14px}.s{font-size:12px;fill:#475467}.box{rx:10;ry:10;stroke-width:1.5}.edge{fill:none;stroke:#667085;stroke-width:1.7;marker-end:url(#a)}</style></defs>
  <rect width="1160" height="560" fill="#fff"/><text x="580" y="30" class="h" text-anchor="middle">Agent 拥有语义决定权，宿主只执行机械保护</text>
  <rect class="box" x="30" y="210" width="145" height="60" fill="#dae8fc" stroke="#6c8ebf"/><text x="103" y="246" class="n" text-anchor="middle" font-weight="700">不可信消息输入</text>
  <path d="M280 180L360 240L280 300L200 240Z" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/><text x="280" y="225" class="n" text-anchor="middle" font-weight="700">事件分类</text><text x="280" y="247" class="s" text-anchor="middle">通知 / 公共问题</text><text x="280" y="266" class="s" text-anchor="middle">聊天 / 个案</text>
  <rect class="box" x="193" y="65" width="175" height="55" fill="#d5e8d4" stroke="#82b366"/><text x="280" y="98" class="n" text-anchor="middle">身份与群权限工具</text>
  <rect class="box" x="390" y="90" width="190" height="68" fill="#d5e8d4" stroke="#82b366"/><text x="485" y="119" class="n" text-anchor="middle" font-weight="700">检索当前有效知识</text><text x="485" y="142" class="s" text-anchor="middle">读取字段级证据</text>
  <rect class="box" x="390" y="205" width="190" height="68" fill="#e1d5e7" stroke="#9673a6"/><text x="485" y="234" class="n" text-anchor="middle" font-weight="700">Qwen + Skills</text><text x="485" y="256" class="s" text-anchor="middle">形成语义决定与回复</text>
  <path d="M680 177L770 239L680 301L590 239Z" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/><text x="680" y="225" class="n" text-anchor="middle" font-weight="700">选择唯一</text><text x="680" y="247" class="n" text-anchor="middle" font-weight="700">最终动作</text>
  <g class="box"><rect x="820" y="55" width="150" height="55" fill="#d5e8d4" stroke="#82b366"/><rect x="985" y="55" width="145" height="55" fill="#fff2cc" stroke="#d6b656"/><rect x="820" y="145" width="150" height="55" fill="#f5f5f5" stroke="#667085"/><rect x="985" y="145" width="145" height="55" fill="#f8cecc" stroke="#b85450"/><rect x="900" y="235" width="170" height="60" fill="#dae8fc" stroke="#6c8ebf"/></g>
  <g class="n" text-anchor="middle"><text x="895" y="79" font-weight="700">SEND</text><text x="895" y="98" class="s">直接群内回复</text><text x="1058" y="79" font-weight="700">DEFER</text><text x="1058" y="98" class="s">等待更多事实</text><text x="895" y="178" font-weight="700">IGNORE</text><text x="1058" y="169" font-weight="700">ESCALATE</text><text x="1058" y="188" class="s">转私下处理</text><text x="985" y="260" font-weight="700">CREATE / UPDATE</text><text x="985" y="281" class="s">知识 · 任务 · Case</text></g>
  <rect class="box" x="720" y="380" width="250" height="78" fill="#fff2cc" stroke="#d6b656"/><text x="845" y="407" class="n" text-anchor="middle" font-weight="700">机械执行保护</text><text x="845" y="430" class="s" text-anchor="middle">白名单 · Schema · 幂等 · 限速 · 暂停</text><text x="845" y="448" class="s" text-anchor="middle">不改变 Agent 的语义动作</text>
  <rect class="box" x="440" y="390" width="200" height="60" fill="#fff2cc" stroke="#d6b656"/><text x="540" y="426" class="n" text-anchor="middle" font-weight="700">Outbox / 审计轨迹</text>
  <rect class="box" x="80" y="390" width="300" height="60" fill="#f8cecc" stroke="#b85450"/><text x="230" y="416" class="s" text-anchor="middle">保护检查失败：REJECTED_BY_EXECUTION_GUARD</text><text x="230" y="437" class="s" text-anchor="middle">记录原因，不调用第二个模型改写决定</text>
  <path class="edge" d="M175 240H200"/><path class="edge" d="M280 180V120"/><path class="edge" d="M360 240H375V124H390"/><path class="edge" d="M485 158V205"/><path class="edge" d="M580 239H590"/><path class="edge" d="M770 239H790V83H820"/><path class="edge" d="M770 239H790V173H820"/><path class="edge" d="M770 239H800V265H900"/><path class="edge" d="M895 110V340H845V380"/><path class="edge" d="M720 420H640"/>
</svg>
