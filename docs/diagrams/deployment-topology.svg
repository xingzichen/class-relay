  <g class="n" text-anchor="middle"><text x="488" y="137" font-weight="700">反向代理 / mTLS</text><text x="488" y="160" class="s">插件与管理入口</text><text x="720" y="136" font-weight="700">knowledge-api</text><text x="720" y="157" class="s">ingest-worker · agent-gateway</text><text x="488" y="263" font-weight="700">DeepSeek Harness</text><text x="488" y="285" class="s">Tool 权限隔离</text><text x="720" y="264" font-weight="700">PostgreSQL</text><text x="720" y="287" class="s">PGroonga + pgvector</text><text x="488" y="394" font-weight="700">附件卷</text><text x="488" y="415" class="s">内容寻址文件</text><text x="720" y="394" font-weight="700">备份卷 / 快照</text><text x="720" y="415" class="s">DB + 附件 + 配置</text><text x="605" y="519" font-weight="700">admin-web：仅管理网段 / VPN</text></g>
