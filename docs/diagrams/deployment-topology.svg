<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="610" viewBox="0 0 1160 610" role="img" aria-labelledby="title desc">
  <title id="title">系统部署拓扑与信任边界</title><desc id="desc">浏览器主机、群晖NAS和模型主机的部署组件、网络方向与安全边界。</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#667085"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#17202a}.h{font-size:16px;font-weight:700}.n{font-size:14px}.s{font-size:12px;fill:#475467}.box{rx:10;ry:10;stroke-width:1.5}.edge{fill:none;stroke:#667085;stroke-width:1.6;marker-end:url(#a)}</style></defs>
  <rect width="1160" height="610" fill="#fff"/>
  <rect x="20" y="30" width="300" height="500" rx="14" fill="#edf4ff" stroke="#6c8ebf"/><text x="170" y="60" class="h" text-anchor="middle">常开浏览器主机</text><text x="170" y="80" class="s" text-anchor="middle">人工登录与安全验证边界</text>
  <rect x="350" y="30" width="510" height="550" rx="14" fill="#eff8ed" stroke="#82b366"/><text x="605" y="60" class="h" text-anchor="middle">群晖 NAS / Docker 网络</text><text x="605" y="80" class="s" text-anchor="middle">业务、Agent 与持久化数据边界</text>
  <rect x="890" y="30" width="250" height="500" rx="14" fill="#f7f0fa" stroke="#9673a6"/><text x="1015" y="60" class="h" text-anchor="middle">模型主机</text><text x="1015" y="80" class="s" text-anchor="middle">仅限局域网推理</text>
  <g class="box" fill="#fff" stroke="#6c8ebf"><rect x="65" y="115" width="210" height="65"/><rect x="65" y="230" width="210" height="75"/><rect x="65" y="360" width="210" height="65"/></g>
  <g class="n" text-anchor="middle"><text x="170" y="143" font-weight="700">Chrome / Edge</text><text x="170" y="164" class="s">微信网页版</text><text x="170" y="260" font-weight="700">Manifest V3 插件</text><text x="170" y="283" class="s">DOM 采集 + Outbox 执行器</text><text x="170" y="388" font-weight="700">健康监控</text><text x="170" y="410" class="s">登录 · 选择器 · 心跳</text></g>
