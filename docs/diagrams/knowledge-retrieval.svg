<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="600" viewBox="0 0 1160 600" role="img" aria-labelledby="title desc">
  <title id="title">知识库分层与混合检索</title><desc id="desc">从原始证据到版本化知识的数据分层，以及全文、向量、融合、重排和版本校验流程。</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#667085"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#17202a}.h{font-size:16px;font-weight:700}.n{font-size:14px}.s{font-size:12px;fill:#475467}.box{rx:10;ry:10;stroke-width:1.5}.edge{fill:none;stroke:#667085;stroke-width:1.6;marker-end:url(#a)}</style></defs>
  <rect width="1160" height="600" fill="#fff"/><rect x="20" y="30" width="510" height="540" rx="14" fill="#f7f7f7" stroke="#667085"/><text x="275" y="60" class="h" text-anchor="middle">知识写入：原始证据 → 可版本化事实</text><rect x="550" y="30" width="590" height="540" rx="14" fill="#f7f7f7" stroke="#667085"/><text x="845" y="60" class="h" text-anchor="middle">问题检索：约束 + 混合召回 + 重排</text>
  <g class="box"><rect x="60" y="95" width="190" height="62" fill="#dae8fc" stroke="#6c8ebf"/><rect x="290" y="95" width="190" height="62" fill="#dae8fc" stroke="#6c8ebf"/><rect x="60" y="215" width="190" height="72" fill="#d5e8d4" stroke="#82b366"/><rect x="290" y="215" width="190" height="72" fill="#d5e8d4" stroke="#82b366"/><rect x="60" y="350" width="190" height="72" fill="#fff2cc" stroke="#d6b656"/><rect x="290" y="350" width="190" height="72" fill="#e1d5e7" stroke="#9673a6"/><rect x="90" y="485" width="360" height="52" fill="#f8cecc" stroke="#b85450"/></g>
  <g class="n" text-anchor="middle"><text x="155" y="122" font-weight="700">身份层</text><text x="155" y="144" class="s">班级 · 学期 · 群 · 身份 · 角色</text><text x="385" y="122" font-weight="700">原始事件层</text><text x="385" y="144" class="s">消息 · 图片 · 文件 · 采集事件</text><text x="155" y="244" font-weight="700">领域知识层</text><text x="155" y="266" class="s">通知版本 · Claim · Evidence</text><text x="385" y="244" font-weight="700">协作层</text><text x="385" y="266" class="s">Project · Task · Case</text><text x="155" y="379" font-weight="700">检索层</text><text x="155" y="401" class="s">retrieval_unit · embedding</text><text x="385" y="379" font-weight="700">Agent 与发送层</text><text x="385" y="401" class="s">run · decision · outbox · receipt</text><text x="270" y="508" class="s">字段级 EvidenceLink 贯穿原消息、附件页 / 图片区域</text><text x="270" y="527" class="s">与通知字段；纠错生成新版本，不覆盖历史证据</text></g>
