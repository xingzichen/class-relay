<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="590" viewBox="0 0 1160 590" role="img" aria-labelledby="title desc">
  <title id="title">关键消息处理流程</title><desc id="desc">老师通知入库和家长问题自动回复的两条端到端流程。</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#667085"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#17202a}.h{font-size:16px;font-weight:700}.n{font-size:13px}.s{font-size:12px;fill:#475467}.box{rx:9;ry:9;stroke-width:1.4}.edge{fill:none;stroke:#667085;stroke-width:1.6;marker-end:url(#a)}</style></defs>
  <rect width="1160" height="590" fill="#fff"/>
  <rect x="20" y="25" width="1120" height="245" rx="14" fill="#f7f7f7" stroke="#667085"/><text x="45" y="57" class="h">A. 老师通知采集与知识入库</text>
  <g class="box"><rect x="45" y="105" width="135" height="58" fill="#dae8fc" stroke="#6c8ebf"/><rect x="215" y="100" width="145" height="68" fill="#dae8fc" stroke="#6c8ebf"/><rect x="395" y="100" width="145" height="68" fill="#d5e8d4" stroke="#82b366"/><rect x="575" y="100" width="145" height="68" fill="#d5e8d4" stroke="#82b366"/><rect x="755" y="100" width="145" height="68" fill="#e1d5e7" stroke="#9673a6"/><rect x="935" y="100" width="165" height="68" fill="#fff2cc" stroke="#d6b656"/><rect x="370" y="205" width="420" height="42" fill="#f8cecc" stroke="#b85450"/></g>
  <g class="n" text-anchor="middle"><text x="113" y="130" font-weight="700">1 老师消息</text><text x="113" y="149" class="s">文本 / 图片 / 文件</text><text x="288" y="127" font-weight="700">2 插件采集</text><text x="288" y="149" class="s">Message Envelope</text><text x="468" y="127" font-weight="700">3 API 幂等写入</text><text x="468" y="149" class="s">原始消息 + Job</text><text x="648" y="127" font-weight="700">4 Worker 解析</text><text x="648" y="149" class="s">图片 / 文件 / 文本</text><text x="828" y="127" font-weight="700">5 Agent 检索</text><text x="828" y="149" class="s">相关通知版本</text><text x="1018" y="127" font-weight="700">6 创建 / 修订</text><text x="1018" y="149" class="s">通知 · 证据 · 任务</text><text x="580" y="231" class="s">7 建立 retrieval_unit 与 Embedding Job；新版本生效，旧版本保留可追溯</text></g>
  <path class="edge" d="M180 134H215"/><path class="edge" d="M360 134H395"/><path class="edge" d="M540 134H575"/><path class="edge" d="M720 134H755"/><path class="edge" d="M900 134H935"/>
  <rect x="20" y="300" width="1120" height="260" rx="14" fill="#f7f7f7" stroke="#667085"/><text x="45" y="332" class="h">B. 家长问题检索、Agent 决策与发送</text>
  <g class="box"><rect x="40" y="385" width="120" height="58" fill="#dae8fc" stroke="#6c8ebf"/><rect x="185" y="380" width="135" height="68" fill="#dae8fc" stroke="#6c8ebf"/><rect x="345" y="380" width="145" height="68" fill="#e1d5e7" stroke="#9673a6"/><rect x="515" y="380" width="145" height="68" fill="#d5e8d4" stroke="#82b366"/><rect x="685" y="380" width="145" height="68" fill="#e1d5e7" stroke="#9673a6"/><rect x="855" y="380" width="135" height="68" fill="#fff2cc" stroke="#d6b656"/><rect x="1015" y="380" width="105" height="68" fill="#dae8fc" stroke="#6c8ebf"/><rect x="330" y="495" width="500" height="42" fill="#f8cecc" stroke="#b85450"/></g>
  <g class="n" text-anchor="middle"><text x="100" y="419" font-weight="700">1 家长提问</text><text x="253" y="407" font-weight="700">2 插件采集</text><text x="253" y="429" class="s">API 触发事件</text><text x="418" y="407" font-weight="700">3 Agent 分类</text><text x="418" y="429" class="s">公共 / 聊天 / 个案</text><text x="588" y="407" font-weight="700">4 混合检索</text><text x="588" y="429" class="s">当前有效证据</text><text x="758" y="407" font-weight="700">5 Agent 选择</text><text x="758" y="429" class="s">唯一最终动作</text><text x="923" y="407" font-weight="700">6 Outbox</text><text x="923" y="429" class="s">保护 + 租约</text><text x="1068" y="407" font-weight="700">7 插件发送</text><text x="1068" y="429" class="s">回执</text><text x="580" y="521" class="s">DEFER / IGNORE / ESCALATE_PRIVATE 不走群内 SEND；所有决定、证据与回执写入审计轨迹</text></g>
  <path class="edge" d="M160 414H185"/><path class="edge" d="M320 414H345"/><path class="edge" d="M490 414H515"/><path class="edge" d="M660 414H685"/><path class="edge" d="M830 414H855"/><path class="edge" d="M990 414H1015"/><text x="840" y="400" class="s">SEND</text>
</svg>
