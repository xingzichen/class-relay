<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>家校日常 · 规则统一原型</title>
<link rel="stylesheet" href="app.css">
<script defer src="app.js"></script>
</head>
<body>
<div id="classroom-miniapp" aria-label="家校日常小程序原型">

<div class="sc-labelbar"><span>家校日常 · 交互原型</span><span>示例数据 · 未连接真实服务</span></div>
<div class="sc-phone">
<header class="sc-head">
<div class="sc-top"><div class="sc-brand"><span class="sc-brandmark"></span>家校日常</div><span class="sc-wechat" aria-hidden="true">··· ⊙</span></div>
<div class="sc-subhead"><span>青禾小学 · 二年级 3 班</span><select id="sc-persona" aria-label="预览身份"><option value="parent">普通家长视角</option><option value="teacher">老师视角</option><option value="committee">家委会视角</option><option value="admin">系统管理员视角</option><option value="successor">李委员（接收人）</option></select></div>
</header>
<main class="sc-main" id="sc-screen"></main>
<div class="sc-toast sc-hidden" id="sc-toast" role="status" aria-live="polite"></div>
<nav class="sc-nav" aria-label="小程序主导航">
<button type="button" data-go="home">首页</button><button type="button" data-go="tasks">待办</button><button type="button" data-go="schedule">日程</button><button type="button" data-go="finance">费用</button><button type="button" data-go="profile">我的</button>
</nav>
</div>

</div>
</body>
</html>
